# =============================================================================
# ClickHouse 集群主机清单（cluster_deploy.sh 使用）
#
# 格式（每行一台，| 分隔，不要加空格）：
#   主机名|IP地址|ZK编号|分片号|副本号
#
#   ZK编号 : 该节点作为 ZooKeeper 节点的 myid（从 1 开始）；0 或留空 = 不部署 ZK
#   分片号 : 该节点所属 ClickHouse 分片编号；0 或留空 = 不部署 ClickHouse
#   副本号 : 该节点在分片中的副本编号（通常每分片 2 个副本：1、2）
#
# 注意：IP 必须是对应主机网卡上【真实存在】的地址，ZK 要把仲裁/选举端口
#       绑定到该 IP；填错会导致 ZK 服务启动即退出（脚本会在安装前校验报错）。
#
# 扩容到几百台：按相同格式继续往下加行即可，无需改脚本。
# 行首 # 为注释，空行忽略。
#
# ZK 端口：客户端 32181（ClickHouse 连接用），内部仲裁 2888、选举 3888。
# =============================================================================

# 默认规划：3 分片 x 2 副本（6 节点）+ 5 节点 ZooKeeper（复用前 5 台）
xxx81|192.168.1.81|1|1|1
xxx82|192.168.1.82|2|1|2
xxx83|192.168.1.83|3|2|1
xxx84|192.168.1.84|4|2|2
xxx85|192.168.1.85|5|3|1
xxx86|192.168.1.86|0|3|2

