.tl .tg{width:16px;text-align:center;font-size:9px;color:var(--mut);flex-shrink:0;transition:transform .2s}
.tl .tg.exp{transform:rotate(90deg)}
.tl .tg.leaf{visibility:hidden}
.tl .ic{margin-right:5px;font-size:13px;flex-shrink:0}

pre code{background:none;color:inherit;padding:0}
.warn{background:#fef2f2;border-left:4px solid #ef4444;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.good{background:#ecfdf5;border-left:4px solid #10b981;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.info{background:#eff6ff;border-left:4px solid #3b82f6;padding:10px 14px;border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{background:#f8fafc;border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.mc h4{font-size:13px;margin-bottom:5px;color:var(--acc)}
.mc p{font-size:12px;color:var(--mut);line-height:1.55}
.steps{counter-reset:s}
.st{position:relative;padding:9px 0 9px 32px;border-left:2px solid var(--bd);margin-left:10px}
.st::before{counter-increment:s;content:counter(s);position:absolute;left:-11px;top:9px;width:22px;height:22px;background:var(--acc);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

.st strong{display:block;margin-bottom:3px;font-size:13.5px}
.st p{font-size:12.5px;color:var(--mut)}

.dia-wrap svg{display:block;margin:0 auto;max-width:100%;height:auto}
.empty{text-align:center;padding:70px 20px;color:var(--mut)}

.tl.match{background:#fef9c3}

<script>
const knowledge=[
{id:"m1",title:"模块一 · 数据库基础知识",icon:"📖",mod:1,page:"P1-10",desc:"SQL Server 数据库基础概念、市场定位、版本分类、版本发展史、核心对象与 T-SQL 基础语法。",children:[
{id:"m1-1",title:"数据库简介与应用场景",icon:"📌",page:"P3-4",desc:"SQL Server 是微软推出的关系型数据库管理系统，全球市场排名前三。",details:[
{type:"list",title:"公司与产品定位",items:["微软（Microsoft）由<strong>比尔·盖茨与保罗·艾伦</strong>于 1975 年创办，总部位于美国华盛顿州，是世界 PC 软件开发的先导","微软是全球最大的电脑软件提供商，<strong>全球软件企业排名第一</strong>（第二、三分别为 Oracle、IBM），最著名产品为 Windows 操作系统和 Office 系列","SQL Server 是微软推出的<strong>关系型数据库管理系统（RDBMS）</strong>，可运行于 Windows 各版本的大型多处理器服务器，也推出了基于 <strong>Linux 平台</strong>的版本","SQL Server 是一个全面的数据库平台，使用集成的<strong>商业智能（BI）</strong>工具提供企业级数据管理"]},
{type:"list",title:"市场份额与应用场景",items:["全球数据库使用关注度排名前三：<strong>Oracle 第一、MySQL 第二、SQL Server 第三</strong>；功能与 Oracle、DB2 并列全球三大数据库","2011 年左右市场份额：<strong>Oracle 48.8%、DB2 20%、SQL Server 17%</strong>","主要面向<strong>中小企业</strong>，最大优势是集成微软各类产品资源、强大可视化界面、高度集成的管理开发工具，在快速构建 BI 方面颇有建树","典型应用：<strong>自建 ERP 系统、商业智能、垂直领域零售商、餐饮、事业单位</strong>等；微软提供整套软件方案，不缺钱但缺 IT 人才的中小企业会偏爱 SQL Server"]},
{type:"info",text:"与 Oracle 的核心区别：<strong>SQL Server 一个实例可包含多个数据库；Oracle 一个实例对应一个数据库</strong>。"}]},
{id:"m1-2",title:"版本分类",icon:"🏷️",page:"P5-6",desc:"SQL Server 五个常见版本及其容量限制与适用场景。",details:[
{type:"grid",cols:[
{h:"Enterprise 企业版",p:"高级版本，提供全面的高端数据中心功能，性能极为快捷，为关键任务工作负荷提供较高服务级别。<strong>最大支持 524PB 数据量</strong>"},
{h:"Standard 标准版",p:"提供基本数据管理，使部门和小型组织顺利运行应用，支持常用开发工具用于本地和云部署，以最少 IT 资源获得高效管理"},
{h:"Web 版",p:"面向 Web 宿主和 Web VAP，提供从小规模到大规模 Web 资产的可伸缩性、经济性和可管理性，<strong>总拥有成本较低</strong>"},
{h:"Developer 开发版",p:"含企业版全部功能，但有许可限制，<strong>只能用于开发和测试，不能用作生产服务器</strong>，是构建和测试应用人员的理想之选"},
{h:"Express 版",p:"入门级<strong>免费</strong>数据库，学习和构建桌面及小型服务器应用的理想选择，<strong>最大支持 10GB 数据量</strong>，可无缝升级到更高端版本"},
{h:"版本演进",p:"2008 提出 Always On 概念 → 2012 引入可用性组（1拖4）→ 2016 引入自动种子 → 2019 为当前实战版本"}]}]},
{id:"m1-3",title:"版本发展史（1988-2019）",icon:"📅",page:"P7-10",desc:"从 1.0 到 2019 的完整版本演进，是理解各高可用特性来源的关键时间线。",details:[
{type:"steps",title:"SQL Server 版本发展时间线",steps:[
{t:"1988 · 1.0",p:"由 Ashton-Tate、Sybase、Microsoft 三家联合开发（背景：1982 Oracle 发布、1983 IBM 发布 DB2）"},
{t:"1992 · 4.2",p:"当时只支持 OS/2 操作系统（1993 年重新命名为 Windows NT 3.1）"},
{t:"1994 · 买断源码",p:"微软从 Sybase 买断源码，双方在数据库开发上的合作中止"},
{t:"1995 · 6.0",p:"<strong>第一个完全由微软自行开发</strong>的产品；1996 年发布 6.5"},
{t:"1998 · 7.0",p:"版本被重写，减少管理负担，引入 OLAP 服务（分析服务）"},
{t:"2000",p:"支持多实例与排序规则，数据库群集、日志传送大量使用，引入数据挖掘，支持 64 位处理器（IA64）"},
{t:"2005",p:"产品进入青壮年；支持 XML 存储查询，用 SSMS 替换旧版企业管理器，增强 T-SQL，<strong>支持数据库镜像</strong>，表和索引分区，语句级重新编译，列加密"},
{t:"2008",p:"<strong>提出 Always On 概念</strong>，增强数据库群集；可热插拔 CPU；空间数据类型、日期时间类型；PowerShell for SQL Server；数据压缩、数据加密"},
{t:"2008 R2",p:"增强多服务器管理能力，引入数据层应用程序"},
{t:"2012",p:"<strong>引入 AlwaysOn 高可用组（1拖4、读写分离）</strong>；列存储索引；新增 Sequence、错误捕获、开窗函数、分析函数；FileTable"},
{t:"2014",p:"增加内存优化表（内存中 OLTP），云增强，备份还原增强，AlwaysOn 增强，增量统计信息"},
{t:"2016",p:"安装时可配置多个 tempDB 文件；仪表板显示耗时/内存/CPU 最多的查询；Azure 混合备份；<strong>AlwaysOn 增强、引入自动种子</strong>；层级安全；时态数据库"},
{t:"2017",p:"数据智能化管理；<strong>跨平台支持 Linux</strong>；支持 Python、机器学习；提升 BI 分析；安全增强"},
{t:"2019",p:"内置大数据、分析所有类型数据；TempDB 可配置为内存优化；智能查询处理；支持 UTF-8；存储过程中执行 Java；加速数据库恢复（ADR）；增强加密；云整合、数据虚拟化"}]}]},
{id:"m1-4",title:"数据库核心对象",icon:"🗄️",page:"P15",desc:"SQL Server 中最基础的对象体系，Schema 是这些对象的容器。",details:[
{type:"list",items:["<strong>表（Table）</strong>：数据存储的基本单位，由行和列组成","<strong>视图（View）</strong>：虚拟表，基于查询结果，不物理存储数据","<strong>存储过程（Procedure）</strong>：预编译 T-SQL 代码块，可重复执行","<strong>函数（Function）</strong>：返回标量值或表值的可复用代码","<strong>触发器（Trigger）</strong>：INSERT/UPDATE/DELETE 事件时自动执行","<strong>索引（Index）</strong>：加速数据检索，分聚集索引和非聚集索引","<strong>约束（Constraint）</strong>：主键、外键、唯一、检查、默认值"]},
{type:"tip",text:"记忆口诀：<strong>表存数据、视图看数据、过程跑逻辑、函数算结果、触发器自动响应、索引提速度、约束保完整</strong>。"}]},
{id:"m1-5",title:"T-SQL 基础语法",icon:"⌨️",page:"P9-10",desc:"增删改查四大基本语句。",details:[
{type:"code",title:"四大基本操作",code:`-- 查询
SELECT 列名 FROM 表名 WHERE 条件 ORDER BY 列名;
-- 插入
INSERT INTO 表名(列1,列2) VALUES(值1,值2);
-- 更新
UPDATE 表名 SET 列1=值1 WHERE 条件;
-- 删除
DELETE FROM 表名 WHERE 条件;`},
{type:"warn",text:"<strong>安全铁律</strong>：UPDATE 和 DELETE 必须带 WHERE！执行前先 SELECT 确认影响行数。生产环境先 BEGIN TRANSACTION 再 COMMIT。"}]}
]},
{id:"m2",title:"模块二 · 数据库体系架构",icon:"🏗️",mod:2,page:"P11-25",desc:"从逻辑层级到核心引擎，再到内存结构，完整理解 SQL Server 的内部运行机制。",children:[
{id:"m2-1",title:"逻辑体系架构（层级图）",icon:"🪜",page:"P12",desc:"从客户端到数据库对象的完整层级关系，是理解 SQL Server 的总纲。",details:[
{type:"diagram",title:"SQL Server 体系架构层级图",page:"P12",svg:"hierarchy"},
{type:"list",title:"层级关系（从上到下）",items:["<strong>客户端/应用端</strong>：通过 Write/Read 请求连接数据库主机","<strong>数据库主机</strong>：承载一个或多个实例","<strong>实例（Instance）</strong>：安装的一个 SQL Server 引擎/服务，同一台机器可装多个独立实例，如 SQLServer1、SQLServer2","<strong>业务数据库</strong>：xxdb1、xxdb2 等用户库，每个实例可含多个","<strong>系统数据库</strong>：master、model、msdb、tempdb，每个实例自带 4 个","<strong>文件组 / 日志文件</strong>：文件组组织数据文件，日志文件独立","<strong>数据文件</strong>：mdf/ndf，隶属于文件组","<strong>Schema</strong>：对象容器，默认 dbo，包含表、索引、视图、过程、函数"]},
{type:"info",text:"数据流：客户端 →（Write/Read）→ 主机 → 实例 → 数据库 → 文件组/日志 → 数据文件 → Schema 对象。"}]},
{id:"m2-2",title:"实例与数据库概念",icon:"🧩",page:"P13",desc:"实例和数据库的关系，以及与 Oracle 的关键差异。",details:[
{type:"grid",cols:[
{h:"实例 Instance",p:"安装的一个 SQL Server 数据库引擎/服务；同一台计算机可安装多个实例，彼此完全独立。<strong>SQL Server 服务器 = 一个实例 + 多个数据库</strong>"},
{h:"数据库 Database",p:"物理上由数据文件和事务日志文件组成，是表、索引、视图、存储过程等各种对象的存放容器"},
{h:"数据文件",p:"存放数据库中的数据（mdf/ndf）"},
{h:"事务日志文件",p:"存放用户对数据库的操作记录，用于实例恢复或介质恢复（类似 Oracle 的 redo+undo，ldf）"}]},
{type:"info",text:"对照：<strong>Oracle 服务器 = 一个 Oracle 实例 + 一个数据库</strong>；SQL Server 一个实例下可挂多个数据库。"}]},
{id:"m2-3",title:"系统数据库与 Schema",icon:"🗃️",page:"P14-15",desc:"4 个默认系统数据库的职责，以及 Schema 对象容器概念。",details:[
{type:"grid",title:"四大系统数据库（每个实例自带）",cols:[
{h:"master",p:"保存实例范围内的<strong>元数据信息、服务器配置、所有数据库信息</strong>以及初始化信息"},
{h:"model",p:"<strong>新数据库的模板</strong>，新建库时以它为蓝本"},
{h:"tempdb",p:"保存临时数据的地方，比如<strong>查询排序</strong>、临时表；实例重启会重建"},
{h:"msdb",p:"SQL Server Agent 保存数据的地方，负责自动化处理，记录<strong>作业（job）、计划（schedule）、警报</strong>等实体信息"}]},
{type:"info",text:"<strong>Schema（模式架构）</strong>：一个数据库包含多个架构，每个架构又包含多个对象，可看作表/索引/视图/存储过程等对象的容器；<strong>SQL Server 默认 Schema 为 dbo</strong>。"}]},
{id:"m2-4",title:"核心引擎四层架构",icon:"⚙️",page:"P17-23",desc:"协议层 → 关系引擎 → 存储引擎 → SQLOS，各组件职责与查询执行的完整路径。",details:[
{type:"diagram",title:"SQL Server 核心架构图（数据流）",page:"P18",svg:"coreEngine"},
{type:"grid",title:"四大组件（对应 P17 英文架构图）",cols:[
{h:"① 协议层 Protocols",p:"接收 TDS 包拆包找出请求，结果打包为 TDS 返回；含 SQL Server 网络接口"},
{h:"② 关系引擎 Query Processor",p:"Parser 解析器、Optimizer 优化器、SQL Manager、Database Manager、Query Executor 查询执行器"},
{h:"③ 存储引擎 Storage Engine",p:"Transaction Services（Lock/File/Buffer Manager）、Access Methods（Row/Indexes/Pages/Allocations/Versions）、Utilities（Bulk Load、DBCC、Backup/Restore）"},
{h:"④ SQLOS 应用层",p:"Deadlock/Resource Monitor、Lazy Writer、Scheduler Monitor、Buffer Pool、Memory Manager、Scheduling、Lock Manager、Sync Services、I/O；外部组件 CLR/MDAC"}]},
{type:"list",title:"协议层（P19）",items:["接收 <strong>TDS 包（表格数据流，用于与数据库服务器交互的协议）</strong>，拆包找出里面的请求，传给命令分析器；结果和状态消息打包为 TDS 消息发回客户端","<strong>共享内存（Shared Memory）</strong>：只能用于本地","<strong>TCP/IP</strong>：指定 IP 和端口（如 <strong>1433</strong>）连接","<strong>命名管道（Named Pipes）</strong>：一般使用 TCP <strong>445</strong> 端口"]},
{type:"list",title:"关系引擎 / 查询处理器（P20）",items:["<strong>命令分析器</strong>：处理 T-SQL 语言事件，检查查询语法、准备查询树，流程为：① 检查语法，错误则经协议层返回客户端 → ② 语法有效则查找已有计划或生成查询计划 → ③ 找到已有计划则从执行计划缓存读取传给执行器 → ④ 没有计划则创建查询树（执行计划）传给优化器，同时缓存到计划缓存","<strong>查询优化器</strong>：负责查询优化和执行，包含 SQL Server 将如何执行这段代码的细节","<strong>查询执行器</strong>：对执行（查询计划）负责"]},
{type:"list",title:"存储引擎（P21-22，负责所有数据 IO）",items:["<strong>存取方法</strong>：行和索引操作、页分配操作、版本操作；处理行/索引/页/分配/行版本的修改 IO 请求，并向缓存区管理器传递请求检索页","<strong>缓存区管理器三步读页</strong>：① 在缓冲池检查该页是否已缓存，命中即传回 → ② 未缓存则从磁盘获取该页并放入数据缓存，再传回 → ③ 存取方法把结果集送回关系引擎发回客户端","<strong>事务管理器</strong>：处理 ACID（原子性、一致性、隔离性、持久性）的数据锁和管理事务日志，由锁管理器、日志管理器组成","<strong>锁管理器</strong>：控制表、页、行和系统数据的锁定，多用户环境下解决冲突，为数据提供并发性","<strong>日志管理器（WAL 预写日志）</strong>：把修改写到事务日志并物理落盘，日志确认写入后才修改实际数据；崩溃后可重做（前滚）已提交改变","<strong>实用工具</strong>：批量加载、DBCC 命令、全文本索引管理、备份和还原命令"]},
{type:"list",title:"SQLOS 与调度（P23）",items:["SQLOS 是位于引擎最底层的独立应用层，负责<strong>调度、内存管理、同步、内存代理、错误处理、死锁检测、扩展事件、异步 I/O</strong>","<strong>Lazy Writer（惰性写入器）</strong>：管理缓冲区，保证 SQLOS 有空闲缓存块和系统有一定可用内存","<strong>CheckPoint（检查点）</strong>：将脏页写入数据文件，<strong>减少服务器恢复时间（Recovery Time）</strong>","<strong>调度模式</strong>（对应 Oracle 共享服务器）：每个 CPU 启动一个 Scheduler，请求交给当前负荷最低的 Scheduler；无空闲 Work 线程则新建一个处理，<strong>Work 线程连续空闲 15 分钟会被销毁并释放内存</strong>"]},
{type:"info",text:"<strong>WAL 预写日志</strong>：事务日志先物理落盘，然后才修改数据页。崩溃后可前滚已提交事务、回滚未提交事务。"}]},
{id:"m2-5",title:"内存结构",icon:"💾",page:"P24-25",desc:"SQL Server 内存构成、Buffer Cache 组成，以及与 Oracle 的对照。",details:[
{type:"diagram",title:"SQL Server 内存结构图",page:"P24",svg:"memory"},
{type:"list",title:"内存构成（对照 Oracle）",items:["<strong>Buffer Cache（Buffer Pool）</strong>：内存主体，相当于 Oracle 的 <strong>SGA</strong>","<strong>Data Cache</strong>：Buffer Cache 最大组成部分，存放由磁盘读取的数据，再次读取时不必读盘（对应 Oracle database buffer cache）","<strong>Plan Cache</strong>：存放编译过的执行计划（对应 Oracle shared pool 中的 library cache）","<strong>Query Workspace</strong>：查询工作区（排序、哈希等）；另有 <strong>Locks 锁</strong>、Other 其他","<strong>Thread Stacks</strong>：线程堆栈；<strong>MemToLeave Area</strong>：预留内存区域"]},
{type:"list",title:"内存设置（P25）",items:["<strong>max server memory</strong>：设置 buffer cache 的上限","<strong>min server memory</strong>：设置 SQL Server 可释放内存的 buffer cache 下限","设置路径：SSMS → 服务器属性 → 内存；默认最大服务器内存为 <strong>2147483647 MB</strong>，最小为 0；<strong>使用 AWE 分配内存</strong>默认不勾选"]},
{type:"warn",text:"生产环境务必设置 <strong>max server memory</strong>，为操作系统预留内存，避免内存压力导致系统卡顿。"}]},
{id:"m2-6",title:"物理文件与其他文件",icon:"📁",page:"P16",desc:"SQL Server 没有控制文件、初始化参数文件、口令文件和归档日志，这是与 Oracle 的重要差异。",details:[
{type:"list",items:["<strong>无控制文件</strong>：各数据库文件信息存储在 master 系统库以及用户数据库 primary 文件组的主数据文件中","<strong>无初始化参数文件</strong>：实例配置信息保存在 master 库；数据库配置信息保存在各自库 primary 文件组的主数据文件中","<strong>无口令文件</strong>：SQL Server 服务由操作系统启动，口令由操作系统维护","<strong>无归档日志文件</strong>"]},
{type:"code",title:"错误日志文件位置（查看实例运行错误）",code:`\Microsoft SQL Server\MSSQL15.MSSQLSERVER\MSSQL\Log`}]}
]},
{id:"m3",title:"模块三 · 高可用方案对比",icon:"🛡️",mod:3,page:"P26-48",desc:"SQL Server 五种高可用技术架构对比，包含完整拓扑图、优缺点、适用场景与 T-SQL。",children:[
{id:"m3-1",title:"方案总览与 RTO/RPO",icon:"⚖️",page:"P28,P36",desc:"SQL Server 高可用技术分类、复制类型及核心指标。",details:[
{type:"list",title:"五大高可用方案（按级别）",items:["<strong>故障转移 HA 集群 FCI（实例级）</strong>：基于 WSFC + 共享存储","<strong>AlwaysOn 可用性组（数据库级）</strong>：多副本，推荐方案","<strong>日志传送 Log Shipping（数据库级）</strong>：备份 → 复制 → 还原","<strong>数据库镜像 Mirroring（数据库级）</strong>：已弃用，被 AlwaysOn 取代","<strong>复制 Replication（数据库级）</strong>：事务复制/快照/合并/对等复制"]},
{type:"list",title:"高可用类型（P36）",items:["日志传送 Log Shipping；事务复制 Transactional Replication；数据库镜像；AlwaysOn FCI；AlwaysOn 可用性组","<strong>其他复制</strong>：快照复制、合并复制、对等复制、可更新订阅","<strong>复制特性</strong>：多源复制（多节点同步至单节点）、筛选复制（单节点分片同步至多节点）"]},
{type:"info",text:"<strong>RTO</strong>（恢复时间目标）：故障后最长停机时间。<strong>RPO</strong>（恢复点目标）：最大数据丢失量。同步提交 RPO≈0，异步提交可能丢数据。"},
{type:"warn",text:"<strong>从 SQL Server 2014 开始，生产环境基本不再使用单独的日志传送、镜像、复制架构，统一使用 AlwaysOn 高可用组。</strong>"}]},
{id:"m3-2",title:"故障转移集群 FCI 架构",icon:"🔄",page:"P29-30,P40",desc:"实例级高可用，基于 Windows 故障转移集群 + 共享存储。",details:[
{type:"diagram",title:"FCI 故障转移集群架构图",page:"P29",svg:"fci"},
{type:"list",title:"应用场景（P30）",items:["硬件故障转移","SQL Server 服务故障转移","人工故障或其他故障"]},
{type:"grid",title:"特性与优点（P40）",cols:[
{h:"VIP 透明",p:"有 VIP 进行高可用，自动故障转移，<strong>秒级切换，对客户端透明</strong>"},
{h:"实例级冗余",p:"实例级别的冗余，管理方便"},
{h:"计算存储分离",p:"计算节点与存储分离（共享存储），支持<strong>跨子网高可用</strong>"}]},
{type:"warn",text:"<strong>缺点</strong>：① 基于域环境和 Windows Cluster，增加维护成本；② 仅有一个计算节点可读写，其他节点不可访问，浪费硬件资源、无负载均衡；③ <strong>存储是单节点，无法防止 I/O 子系统故障</strong>。"}]},
{id:"m3-3",title:"AlwaysOn 可用性组架构",icon:"⭐",page:"P31-32",desc:"数据库级高可用，替代镜像的企业级方案，是当前生产环境首选。",details:[
{type:"diagram",title:"AlwaysOn 可用性组架构图",page:"P31",svg:"alwayson"},
{type:"list",title:"核心介绍（P32）",items:["是一个提供<strong>替代数据库镜像</strong>的企业级高可用性和灾难恢复解决方案","SQL Server 2012 引入 AlwaysOn 可用性组，最大程度提高一组用户数据库的可用性，<strong>合并了故障转移、日志传送、镜像、复制</strong>技术","可用性组针对一组离散的用户数据库支持故障转移环境","一个可用性组支持<strong>一组读写主数据库 + 1~4 组对应辅助数据库</strong>","可使辅助数据库进行<strong>只读访问和/或某些备份操作</strong>","各节点安装独立 SQL Server 实例，<strong>不需要共享存储</strong>，通过侦听器（Listener）提供 VIP，依赖 WSFC 做故障检测和仲裁"]},
{type:"warn",text:"<strong>从 2014 开始生产环境统一使用 AlwaysOn 高可用组</strong>，不再单独使用日志传送/镜像/复制。"}]},
{id:"m3-4",title:"日志传送 Log Shipping",icon:"📤",page:"P33,P37",desc:"通过定时备份、复制、还原事务日志实现异步同步。",details:[
{type:"diagram",title:"日志传送架构图",page:"P37",svg:"logShipping"},
{type:"list",title:"功能与实现条件（P33）",items:["多台主从服务器定时备份同步；可实现负载均衡；可提供副本只读查询","<strong>数据库必须是完整备份模式</strong>","主服务器/辅助服务器/监视服务器的备份文件夹必须有读写权限","<strong>SQL Server Agent 代理服务必须启动</strong>"]},
{type:"list",title:"四类作业（P37）",items:["<strong>备份作业</strong>：主服务器实例备份事务日志","<strong>复制作业</strong>：将日志文件复制到辅助服务器实例","<strong>还原作业</strong>：辅助服务器实例还原日志备份","<strong>警报作业</strong>：备份还原未成功时警报"]},
{type:"good",text:"<strong>优点</strong>：数据库级备份还原同步；不限辅助节点；辅助节点临时可读；<strong>设置延迟备份还原可找回历史数据</strong>。"},
{type:"warn",text:"<strong>缺点（7 条）</strong>：① 延迟同步，宕机丢数据；② 无 VIP，不可自动故障转移；③ 宕机恢复慢；④ 切换节点后不可逆，所有节点需重新配置；⑤ 切换需手动同步账户、代理作业等；⑥ 还原时辅助节点不可读；⑦ 依赖代理作业维护。"}]},
{id:"m3-5",title:"事务复制 Replication",icon:"🔀",page:"P35,P38",desc:"发布-分发-订阅模式，基于事务日志同步。",details:[
{type:"diagram",title:"事务复制架构图",page:"P38",svg:"replication"},
{type:"list",title:"功能与好处（P35）",items:["支持负载均衡；支持副本读写操作；支持数据合并；支持故障转移","实现简单，数据同时同步几乎达到镜像；<strong>可以对某些表或表数据过滤进行复制</strong>"]},
{type:"list",title:"原理三步（P38）",items:["<strong>发布服务器/发布数据库</strong>：事务日志记录并保留所有未分发的事务","<strong>分发服务器/分发数据库</strong>：作为转储队列，Log Reader Agent（日志读取器）读取发布库事务日志，标志并分发事务到分发库","<strong>订阅服务器/订阅数据库</strong>：Distribution Agent（分发代理）读取分发库事务记录并应用到订阅库"]},
{type:"grid",title:"优点与缺点",cols:[
{h:"优点",p:"逻辑同步；<strong>对象级别（表/视图/函数/存储过程）同步，灵活</strong>；不限辅助节点；辅助节点可读"},
{h:"缺点",p:"<strong>表必须有主键</strong>；订阅对象可操作易数据不一致；同步开销大；大事务有延迟宕机丢数据；无 VIP 不可自动转移；切换不可逆；需手动同步账户/作业；依赖代理作业"}]},
{type:"warn",text:"<strong>不支持故障自动切换，不适合做高可用</strong>。"}]},
{id:"m3-6",title:"数据库镜像 Mirroring",icon:"🪞",page:"P34,P39",desc:"一主一从完整镜像，含见证服务器可自动切换，已被 AlwaysOn 取代。",details:[
{type:"diagram",title:"数据库镜像架构图",page:"P39",svg:"mirroring"},
{type:"list",title:"功能与实现条件（P34）",items:["实现数据库完整镜像；支持自动故障转移；确保数据完整性","支持同步或异步镜像，能实现快速故障转移","<strong>需要 3 台服务器</strong>：主体服务器、镜像服务器、见证服务器"]},
{type:"list",title:"工作原理（P39）",items:["主库日志变化记录在日志缓冲区","固化到本地 LDF 时，日志进程把日志记录打包成<strong>日志块</strong>发送到镜像日志缓存","镜像固化日志到 LDF（高安全模式此时可返回确认 ACK）"]},
{type:"list",title:"优点",items:["数据库级别同步；可<strong>同步提交（高安全，不丢数据）/异步提交（高性能）</strong>","自动故障转移（高安全模式 + 见证服务器）；手动故障转移切换方便快速","节点恢复后自动修复加入同步；对客户端透明，Driver 层支持"]},
{type:"code",title:"客户端镜像连接串",code:`Server=ip1,port1; Failover Partner=ip2,port2;`},
{type:"warn",text:"<strong>缺点</strong>：① 有且仅有一主一从两个副本；② 镜像副本不可读（可读方法：高安全模式 + 镜像库快照）；③ SQL Server 版本要求相同；④ 无 VIP，高可用需其他方法设置；⑤ 见证服务器仅作仲裁节点，不存储数据；⑥ 不支持分布式事务、不支持跨数据库事务。"}]},
{id:"m3-7",title:"可用性模式与故障转移",icon:"🎚️",page:"P41-43",desc:"同步/异步模式与自动/手动转移的组合，以及五个故障转移级别。",details:[
{type:"diagram",title:"可用性模式与故障转移类型",page:"P42",svg:"failoverMode"},
{type:"table",title:"故障转移条件级别（Failure Condition Level，P41/P43）",head:["T-SQL值","级别","触发条件"],rows:[
["1","一级","服务器关闭、SQL Server 服务停止。因没有从实例接收到 ACK，连接 WSFC 集群的可用性组租约到期"],
["2","二级","服务器无响应。实例未连接到集群，且超出用户指定的运行状况检查超时阈值，副本处于失败状态"],
["3","三级（默认）","出现严重 SQL Server 内部错误（孤立自旋锁、严重写访问冲突或过多转储）。<strong>这是默认级别</strong>"],
["4","四级","出现中等 SQL Server 内部错误（SQL Server 内部资源池出现持久的内存不足）"],
["5","五级","出现任何符合的失败条件（工作线程耗尽、无法解决的死锁），限制最多的级别"]]},
{type:"code",title:"故障转移策略 T-SQL",code:`ALTER AVAILABILITY GROUP AG1 SET (FAILURE_CONDITION_LEVEL = 3);
ALTER AVAILABILITY GROUP AG1 SET (HEALTH_CHECK_TIMEOUT = 30000);`}]},
{id:"m3-8",title:"备份选项与只读路由",icon:"🔍",page:"P44-46",desc:"AlwaysOn 备份位置四选项、辅助副本备份方案，以及只读路由机制。",details:[
{type:"table",title:"备份选项（P44，决定备份在哪类副本执行）",head:["备份选项","说明"],rows:[
["优先辅助（默认）","备份应在辅助副本上发生，但主副本是唯一联机副本时除外（此时在主副本备份）。<strong>默认选项</strong>"],
["仅辅助","备份永远不会在主副本执行；如果主副本是唯一联机副本，则备份不会发生"],
["主要节点","备份始终在主副本发生；当需要辅助副本不支持的功能（如<strong>差异备份</strong>）时使用"],
["任何副本","选择备份副本时忽略可用性副本角色，备份作业另按副本备份优先级、操作状态、已连接状态评估"]]},
{type:"diagram",title:"备份方案",page:"P45",svg:"backupPlan"},
{type:"code",title:"判断当前副本是否为首选备份副本",code:`sys.fn_hadr_backup_is_preferred_replica`},
{type:"diagram",title:"只读路由架构图",page:"P46",svg:"readOnlyRouting"},
{type:"code",title:"只读路由设置四步",code:`-- 1. 设置副本允许只读连接
ALTER AVAILABILITY GROUP AG1 MODIFY REPLICA ON N'Instance'
  WITH (ALLOW_CONNECTIONS = READ_ONLY);
-- 2. 设置副本路由地址
ALTER AVAILABILITY GROUP AG1 MODIFY REPLICA ON N'Instance'
  WITH (READ_ONLY_ROUTING_URL = N'TCP://IP:1433');
-- 3. 添加路由列表（访问顺序）
ALTER AVAILABILITY GROUP AG1 MODIFY REPLICA ON N'Instance'
  WITH (READ_ONLY_ROUTING_LIST = (N'Instance02',N'Instance01'));
-- 4. 客户端连接串设置
ApplicationIntent=ReadOnly;`},
{type:"warn",text:"只读路由<strong>不是读写分离、不是负载均衡</strong>，仅仅是只读高可用，需要特别的连接设置（ApplicationIntent=ReadOnly）才生效。"}]},
{id:"m3-9",title:"自动种子设定",icon:"🌱",page:"P47",desc:"SQL Server 2016 引入的副本初始化新功能，免去手动备份还原。",details:[
{type:"diagram",title:"自动种子设定流程",page:"P47",svg:"autoSeeding"},
{type:"info",text:"2012/2014 中初始化次要副本的唯一方法是备份、复制和还原；2016 引入<strong>自动种子设定</strong>，通过日志流传输（VDI）将备份流式传输到每个次要副本。"},
{type:"code",title:"自动种子 T-SQL",code:`-- 次要副本（或所有副本）允许自动创建数据库
ALTER AVAILABILITY GROUP [AG_Name] GRANT CREATE ANY DATABASE;

-- 主副本查询各副本种子模式，并生成改为自动的语句
select name,replica_server_name,seeding_mode
,'ALTER AVAILABILITY GROUP ['+name+'] MODIFY REPLICA ON '
 +replica_server_name+' WITH (SEEDING_MODE = AUTOMATIC)'
from sys.availability_replicas ar
inner join sys.availability_groups ag on ar.group_id=ag.group_id;`},
{type:"code",title:"传统初始化（备份/还原方式，对比）",code:`BACKUP DATABASE [NewDbName] TO DISK='NewDbName.BAK';
GO
BACKUP LOG [NewDbName] TO DISK='NewDbName_log.TRN';
GO
ALTER AVAILABILITY GROUP [AG_Name] ADD DATABASE [NewDbName];
GO`}]}

<script>
const treeEl=document.getElementById('tree'),ctEl=document.getElementById('ct'),si=document.getElementById('si'),sc=document.getElementById('sc');
function renderTree(nodes,parent){
nodes.forEach(n=>{
const ne=document.createElement('div');ne.className='tree-node m'+(n.mod||'');ne.dataset.id=n.id;
const lb=document.createElement('div');lb.className='tl';
const hc=n.children&&n.children.length;
lb.innerHTML='<span class="tg '+(hc?'':'leaf')+'">▶</span><span class="ic">'+(n.icon||'📄')+'</span><span class="tx">'+n.title+'</span>'+(n.page?'<span class="pg">'+n.page+'</span>':'');
lb.onclick=function(e){e.stopPropagation();if(hc){const ch=ne.querySelector(':scope > .tc');const tg=lb.querySelector('.tg');ch.classList.toggle('open');tg.classList.toggle('exp');}show(n);document.querySelectorAll('.tl.active').forEach(function(x){x.classList.remove('active');});lb.classList.add('active');};
ne.appendChild(lb);
if(hc){const ce=document.createElement('div');ce.className='tc';renderTree(n.children,ce);ne.appendChild(ce);}
parent.appendChild(ne);
});}
renderTree(knowledge,treeEl);
treeEl.querySelectorAll(':scope > .tree-node > .tc').forEach(function(e){e.classList.add('open');e.previousElementSibling.querySelector('.tg').classList.add('exp');});
function findBC(id,nodes,path){
nodes=knowledge;path=[];
function walk(ns,p){for(var i=0;i<ns.length;i++){var n=ns[i];var np=p.concat(n);if(n.id===id)return np;if(n.children){var r=walk(n.children,np);if(r)return r;}}return null;}
return walk(knowledge,[]);}
function show(n){
const bc=findBC(n.id)||[];
let h='<div class="ch"><h2>'+(n.icon||'📄')+' '+n.title+' '+(n.page?'<span class="tag tp">'+n.page+'</span>':'')+'</h2><div class="bc">'+bc.map(function(c){return '<span onclick="jump(\''+c.id+'\')">'+c.title+'</span>';}).join(' / ')+'</div></div>';
if(n.desc)h+='<div class="card"><p style="font-size:14px;color:#475569">'+n.desc+'</p></div>';
if(n.details)n.details.forEach(function(d){h+=renderD(d);});
if(!n.desc&&!n.details)h+='<div class="card"><p>点击左侧子节点查看。</p></div>';
ctEl.innerHTML=h;ctEl.scrollTop=0;}
function renderD(d){
switch(d.type){
case 'list':return '<div class="card"><h3>'+(d.title||'')+'</h3><ul>'+d.items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>';
case 'grid':return '<div class="card"><h3>'+(d.title||'')+'</h3><div class="g2">'+d.cols.map(function(c){return '<div class="mc"><h4>'+c.h+'</h4><p>'+c.p+'</p></div>';}).join('')+'</div></div>';
case 'code':return '<div class="card"><h3>'+(d.title||'')+'</h3><pre><code>'+d.code+'</code></pre></div>';
case 'warn':return '<div class="warn">⚠️ <strong>注意：</strong>'+d.text+'</div>';
case 'tip':return '<div class="good">💡 <strong>技巧：</strong>'+d.text+'</div>';
case 'info':return '<div class="info">ℹ️ '+d.text+'</div>';
case 'steps':return '<div class="card"><h3>'+(d.title||'')+'</h3><div class="steps">'+d.steps.map(function(s){return '<div class="st"><strong>'+s.t+'</strong><p>'+s.p+'</p></div>';}).join('')+'</div></div>';
case 'table':{var th='<table class="hk"><thead><tr>';d.head.forEach(function(c){th+='<th>'+c+'</th>';});th+='</tr></thead><tbody>';d.rows.forEach(function(r){th+='<tr>';r.forEach(function(c){th+='<td>'+c+'</td>';});th+='</tr>';});th+='</tbody></table>';return '<div class="card"><h3>'+(d.title||'')+'</h3>'+th+'</div>';}
case 'diagram':{return '<div class="dia-wrap"><div class="dia-title">📊 '+d.title+' '+(d.page?'<span class="pg-tag">'+d.page+'</span>':'')+'</div>'+(SVG[d.svg]||'')+'</div>';}
default:return'';}}
window.jump=function(id){
const ne=document.querySelector('.tree-node[data-id="'+id+'"]');if(!ne)return;
let p=ne.parentElement;while(p&&p.classList.contains('tc')){p.classList.add('open');const t=p.previousElementSibling&&p.previousElementSibling.querySelector('.tg');if(t)t.classList.add('exp');p=p.parentElement;}
ne.querySelector(':scope > .tl').click();ne.scrollIntoView({behavior:'smooth',block:'center'});};
let tm;
si.oninput=function(){clearTimeout(tm);tm=setTimeout(search,180);};
sc.onclick=function(){si.value='';sc.style.display='none';clrSearch();};
function search(){
const q=si.value.trim().toLowerCase();sc.style.display=q?'block':'none';
if(!q){clrSearch();return;}
document.querySelectorAll('.tl.match').forEach(function(e){e.classList.remove('match');});
let cnt=0,first=null;
function walk(nodes){nodes.forEach(function(n){
const ne=document.querySelector('.tree-node[data-id="'+n.id+'"]');if(!ne)return;
const lb=ne.querySelector(':scope > .tl');
const t=(n.title+' '+(n.desc||'')+' '+(n.page||'')).toLowerCase();
if(t.indexOf(q)>=0){cnt++;lb.classList.add('match');if(!first)first=n;let p=ne.parentElement;while(p&&p.classList.contains('tc')){p.classList.add('open');const tg=p.previousElementSibling&&p.previousElementSibling.querySelector('.tg');if(tg)tg.classList.add('exp');p=p.parentElement;}}
if(n.children)walk(n.children);});}
walk(knowledge);
if(first){show(first);document.querySelectorAll('.tl.active').forEach(function(e){e.classList.remove('active');});const l=document.querySelector('.tree-node[data-id="'+first.id+'"] > .tl');if(l)l.classList.add('active');}
document.getElementById('st').textContent='匹配 '+cnt+' 个知识点';}
function clrSearch(){document.querySelectorAll('.tl.match').forEach(function(e){e.classList.remove('match');});document.getElementById('st').textContent='5大模块 · 35个知识点 · 12张架构图';}
function exAll(){document.querySelectorAll('.tc').forEach(function(e){e.classList.add('open');});document.querySelectorAll('.tg').forEach(function(e){if(!e.classList.contains('leaf'))e.classList.add('exp');});}
function colAll(){document.querySelectorAll('.tc').forEach(function(e){e.classList.remove('open');});document.querySelectorAll('.tg').forEach(function(e){e.classList.remove('exp');});treeEl.querySelectorAll(':scope > .tree-node > .tc').forEach(function(e){e.classList.add('open');});treeEl.querySelectorAll(':scope > .tree-node > .tl > .tg').forEach(function(e){e.classList.add('exp');});}
</script>
